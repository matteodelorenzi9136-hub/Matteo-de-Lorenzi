<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="Matteo De Lorenzi — Digital Professional & Personal Card">
<title>Matteo De Lorenzi | Digital Card</title>

<style>
:root{
--dark:#111827;
--teal:#0f766e;
--mint:#5eead4;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#dfe5ea,#f7f8fa);
color:var(--dark);
}

.wrap{
max-width:520px;
margin:auto;
padding:22px 16px 40px;
}

.card{
background:var(--dark);
color:white;
border-radius:28px;
overflow:hidden;
box-shadow:0 24px 70px rgba(0,0,0,.20);
}

.top{
padding:34px 28px 30px;
background:linear-gradient(145deg,#111827,#0b3f3d);
text-align:center;
}

.badge{
display:inline-block;
color:var(--mint);
border:1px solid rgba(94,234,212,.35);
border-radius:999px;
padding:7px 12px;
font-size:11px;
font-weight:bold;
letter-spacing:.12em;
text-transform:uppercase;
}

.avatar{
display:block;
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
margin:22px auto 18px;
border:3px solid var(--mint);
box-shadow:0 10px 30px rgba(0,0,0,.30);
}

h1{
font-size:38px;
line-height:.95;
margin:0;
letter-spacing:-.04em;
}

h1 span{
color:var(--mint);
}

.subtitle{
color:rgba(255,255,255,.70);
font-size:14px;
line-height:1.5;
margin:14px 0 25px;
}

.choice{
display:grid;
gap:12px;
}

.choice a{
display:block;
text-decoration:none;
color:white;
border-radius:18px;
padding:20px;
text-align:left;
transition:.2s;
}

.choice a:active{
transform:scale(.98);
}

.professional{
background:linear-gradient(135deg,#0f766e,#115e59);
}

.personal{
background:linear-gradient(135deg,#475569,#334155);
}

.choice strong{
display:block;
font-size:17px;
margin-bottom:6px;
}

.choice span{
font-size:12px;
color:rgba(255,255,255,.70);
}

.footer{
text-align:center;
color:#64748b;
font-size:11px;
margin-top:16px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="top">

<div class="badge">
Digital Card
</div>

<img
class="avatar"
src="profile.jpg"
alt="Matteo De Lorenzi"
>

<h1>
Matteo<br>
<span>De Lorenzi</span>
</h1>

<div class="subtitle">
Digital Professional & Personal Card
</div>

<div class="choice">

<a class="professional" href="professional.html">

<strong>
💼 Area Professionale
</strong>

<span>
Quality · Metrology · Automotive · Lean Six Sigma
</span>

</a>

<a class="personal" href="personal.html">

<strong>
👤 Area Personale
</strong>

<span>
Social · Contatti · Interessi
</span>

</a>

</div>

</div>

</div>

<div class="footer">
Pagina pensata per essere aperta tramite NFC.
</div>

</div>

</body>
</html>
